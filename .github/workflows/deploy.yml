name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # rekal.dev/install.sh is a mirror of rekal-cli's scripts/install.sh.
      # It once sat a full release behind and served an installer that still
      # required Claude Code and still resolved versions through the
      # rate-limited GitHub API. Pull the canonical copy at build time so what
      # the site serves cannot fall behind the CLI, and warn when the
      # committed file needs updating. A fetch failure falls back to the
      # committed copy rather than blocking an unrelated site deploy.
      - name: Sync install.sh from rekal-cli
        env:
          CANONICAL: https://raw.githubusercontent.com/rekal-dev/rekal-cli/main/scripts/install.sh
        run: |
          if curl -fsSL --retry 3 --retry-delay 2 "$CANONICAL" -o /tmp/install.sh \
             && [ -s /tmp/install.sh ] && head -1 /tmp/install.sh | grep -q '^#!'; then
            if diff -q /tmp/install.sh public/install.sh >/dev/null 2>&1; then
              echo "public/install.sh matches rekal-cli"
            else
              echo "::warning::public/install.sh is behind rekal-cli; deploying the canonical copy. Commit the update."
              diff -u public/install.sh /tmp/install.sh || true
              cp /tmp/install.sh public/install.sh
            fi
          else
            echo "::warning::Could not fetch the canonical install.sh; deploying the committed copy."
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
